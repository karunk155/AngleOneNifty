<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Level Obedience</title>
<style>
:root{--bg:#0e1116;--pn:#161b22;--ln:#262d38;--tx:#d7dde6;--mu:#7d8896;--ac:#4da3ff;--up:#3ecf8e;--dn:#ff6b6b;--am:#e3b341}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
.m,td.n{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
header{padding:14px 16px;border-bottom:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline}
h1{font-size:16px;margin:0;font-weight:600}.mu{color:var(--mu)}.tag{border:1px solid var(--am);color:var(--am);border-radius:4px;padding:0 6px;font-size:12px}
.spot{font-size:22px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);margin-right:6px}
.err{background:#3a1d1d;color:#ffb4b4;padding:10px 16px}
nav,.row{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px}
button{background:none;color:var(--tx);border:1px solid var(--ln);border-radius:18px;padding:6px 14px;font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac)}button.on{border-color:var(--ac);color:var(--ac);background:#12233a}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{text-align:right;color:var(--mu);font-weight:400;padding:8px 12px;border-bottom:1px solid var(--ln);font-size:13px}th:first-child,td:first-child{text-align:left}
td{padding:10px 12px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}td:first-child{white-space:normal;min-width:180px}
.sp td{background:#12233a;color:var(--ac);text-align:center!important;padding:6px;border-block:1px solid var(--ac)}
.up{color:var(--up)}.dn{color:var(--dn)}.sm{font-size:12px;color:var(--mu)}.empty{padding:32px 16px;color:var(--mu)}
</style></head><body>
<header><h1>Level Obedience</h1><span class="tag">paper trade</span>
<span class="m">NIFTY <span class="spot" id="spot">–</span></span><span class="mu m" id="atr"></span>
<span class="mu" id="upd"></span></header>
<div class="err" id="err" hidden></div>
<nav><button data-tab="levels" class="on">Levels</button><button data-tab="trades">Trade history</button></nav>
<div id="lv"><div class="row" id="groups"></div>
<div class="row" id="filters"></div><div class="wrap"><table><thead><tr><th>Level<th>Price<th>Distance<th>Held / broke</thead><tbody id="body"></tbody></table></div></div>
<div id="tr" hidden><div class="row m" id="sum"></div><div class="wrap"><table><thead><tr><th>Time<th>Side<th>Entry<th>Stop<th>Target<th>Exit<th>P&amp;L pts</thead><tbody id="tb"></tbody></table></div></div>
<script>
const $=s=>document.querySelector(s),f=(n,d=2)=>n.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
let S={},T=[],tab='levels',show='all',off=new Set();
const FILTERS={all:'All levels',tested:'Tested only',near:'Within 2 ATR',obey:'Obeyed / holding'};
async function load(){try{S=await(await fetch('/api/state')).json();T=await(await fetch('/api/trades')).json()}catch(e){S={error:'Server unreachable'}}draw()}
function pass(l){const n=l.held+l.broke;
 if(off.has(l.group))return false;
 if(show==='tested')return n>0;
 if(show==='near')return Math.abs(l.price-S.spot)<=2*S.atr;
 if(show==='obey')return l.held>=2&&l.held/n>=.6;return true}
function draw(){
 $('#err').hidden=!S.error;$('#err').textContent=S.error||'';
 if(S.spot){$('#spot').textContent=f(S.spot);$('#atr').textContent='ATR(5m) '+f(S.atr);$('#upd').innerHTML='<span class="dot"></span>'+S.updated.slice(11,19)+' IST'}
 const groups=[...new Set((S.levels||[]).map(l=>l.group))];
 $('#groups').innerHTML=groups.map(g=>`<button data-g="${g}" class="${off.has(g)?'':'on'}">${g}</button>`).join('');
 $('#filters').innerHTML=Object.entries(FILTERS).map(([k,v])=>`<button data-f="${k}" class="${show===k?'on':''}">${v}</button>`).join('');
 const ls=(S.levels||[]).filter(pass).sort((a,b)=>b.price-a.price);let h='',placed=false;
 const spotRow=`<tr class="sp"><td colspan="4" class="m">spot ${f(S.spot||0)}</td></tr>`;
 for(const l of ls){if(!placed&&l.price<S.spot){h+=spotRow;placed=true}
  const d=l.price-S.spot,n=l.held+l.broke,zone=l.lo!==l.hi?`<div class="sm m">${f(l.lo)} – ${f(l.hi)}</div>`:'';
  const tags=(l.dynamic?'<span class="sm">moves with every candle</span> ':'')+(!l.dynamic&&n<5?'<span class="tag">short history</span>':'');
  h+=`<tr><td>${l.name}<div class="sm">${l.group} ${tags}</div></td><td class="n">${f(l.price)}${zone}</td>
  <td class="n ${d>0?'up':'dn'}">${d>0?'+':''}${f(d)}<div class="sm">${f(Math.abs(d)/S.atr)} ATR</div></td>
  <td class="n">${l.dynamic?'–':`<span class="up">${l.held}✓</span> <span class="dn">${l.broke}✗</span>`}</td></tr>`}
 if(!placed&&ls.length)h+=spotRow;
 $('#body').innerHTML=h||'<tr><td colspan="4" class="empty">No levels match these filters.</td></tr>';
 const cl=T.filter(t=>t.status==='closed'),tot=cl.reduce((s,t)=>s+t.pnl,0);
 $('#sum').innerHTML=`<span>${T.length} trades</span><span class="mu">total</span><span class="${tot>=0?'up':'dn'}">${tot>=0?'+':''}${f(tot)} pts</span>`;
 $('#tb').innerHTML=T.map(t=>`<tr><td>${t.time.slice(5,16).replace('T',' ')}<div class="sm">${t.level}</div></td><td class="${t.side==='LONG'?'up':'dn'}">${t.side}</td>
 <td class="n">${f(t.entry)}</td><td class="n">${f(t.sl)}</td><td class="n">${f(t.tp)}</td><td class="n">${t.exit?f(t.exit)+`<div class="sm">${t.reason}</div>`:'open'}</td>
 <td class="n ${t.pnl>=0?'up':'dn'}">${t.pnl!=null?(t.pnl>=0?'+':'')+f(t.pnl):'–'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No paper trades yet. Trades open when spot is within 0.25 ATR of a level that has held at least 2 times.</td></tr>';
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));$('#lv').hidden=tab!=='levels';$('#tr').hidden=tab!=='trades'}
 if(b.dataset.f)show=b.dataset.f;if(b.dataset.g)off.has(b.dataset.g)?off.delete(b.dataset.g):off.add(b.dataset.g);draw()});
load();setInterval(load,10000);
</script></body></html>
